name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  packages: read

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: Directory.Packages.props

      - name: Version ermitteln
        id: ver
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "v=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "v=0.0.0-dev.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore (GitHub Packages)
        env:
          NUGET_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          dotnet nuget update source kromodix-github \
            --username github-actions \
            --password "${NUGET_AUTH_TOKEN}" \
            --store-password-in-clear-text
          dotnet restore

      - name: Build
        run: >
          dotnet build --no-restore -c Release
          -p:Version=${{ steps.ver.outputs.v }}

      - name: Plugin-Bundle packen (Plugin-DLL + plugin.json + plugin-eigene Deps)
        # Alles aus bin/ AUSSER .pdb + .xml + .deps.json — REKURSIV, sonst
        # bleiben die 250 MB großen SkiaSharp-Windows-PDBs unter
        # runtimes/win-*/native/ drin. `rm -f bundle/*.pdb` fängt nur die
        # erste Ebene, `find … -delete` alle Tiefen.
        # Die csproj ist so konfiguriert dass Host-Assemblies (Kroste.*,
        # Avalonia*, CommunityToolkit.Mvvm) gar nicht im Output landen —
        # alles was hier ist, ist echte Plugin-Runtime-Dep (HtmlAgilityPack,
        # Pfim, SkiaSharp inkl. runtimes/ native libs).
        run: |
          mkdir -p bundle
          cp -r KroModIx.Plugin.LS25/bin/Release/net10.0/. bundle/
          find bundle -type f \( -name '*.pdb' -o -name '*.xml' -o -name '*.deps.json' \) -delete
          # WICHTIG: die plugin.json im Source-Repo enthält eine hart codierte
          # "version"-Zeile. Beim Release-Tag durch die Tag-Version ersetzen,
          # sonst hat der PluginUpdateService eine Endlosschleife
          # („Update verfügbar" → Install → beim nächsten Check wieder verfügbar).
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            sed -i -E 's/("version"\s*:\s*)"[^"]+"/\1"'"${{ steps.ver.outputs.v }}"'"/' bundle/plugin.json
            echo "== gepatchte plugin.json =="
            grep '"version"' bundle/plugin.json
          fi
          cd bundle
          zip -r "../KroModIx.Plugin.LS25-${{ steps.ver.outputs.v }}.zip" .

      - name: GitHub-Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v3
        with:
          files: KroModIx.Plugin.LS25-*.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
