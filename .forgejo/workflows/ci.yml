# **Forgejo-Fassung von .github/workflows/ci.yml.**
#
# Erzeugt von Werkzeuge/forgejo/workflow-uebertragen.py am 27.10.2026.
# Gebaut wird fuer git.flexfamily.cloud; die GitHub-Fassung bleibt vorerst
# daneben bestehen.
#
# **Beide Dateien gehoeren synchron.** Wer an den Bauschritten etwas
# aendert, zieht es hier nach -- sonst laufen die Seiten auseinander, und
# das faellt erst auf, wenn eine von beiden rot wird.
#
# Diese Datei muss hier liegen, auch wenn sie unveraendert ist: Sobald
# .forgejo/workflows existiert, ignoriert Forgejo .github/workflows
# vollstaendig. Ohne die Kopie laeuft in Forgejo gar keine CI mehr.

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: Directory.Packages.props

      - name: Restore (Forgejo-Registry)
        env:
          NUGET_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Die Quelle heisst seit dem 27.10.2026 kromodix-forgejo und zeigt
          # auf die eigene Forge. Der Benutzername ist beliebig, Forgejo
          # prueft nur den Token.
          dotnet nuget update source kromodix-forgejo \
            --username forgejo-actions \
            --password "${NUGET_AUTH_TOKEN}" \
            --store-password-in-clear-text
          dotnet restore

      - run: dotnet build --no-restore -c Release
      - run: dotnet test --no-build -c Release
